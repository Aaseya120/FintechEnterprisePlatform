name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fintech-enterprise-platform

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Build, Test & Quality Scan
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Maven Build, Unit & Integration Tests, SonarQube Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for SonarQube analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Unit Tests with JaCoCo Coverage
        run: |
          mvn clean org.jacoco:jacoco-maven-plugin:prepare-agent test \
              org.jacoco:jacoco-maven-plugin:report \
              --batch-mode --errors -Dmaven.test.failure.ignore=false

      - name: SonarQube Static Code Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            mvn sonar:sonar \
              -Dsonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}" \
              -Dsonar.login="$SONAR_TOKEN"
          else
            echo "Skipping SonarQube scan: SONAR_TOKEN not set in repository secrets."
          fi

      - name: Upload Test and JaCoCo Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-and-coverage-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/

  # ---------------------------------------------------------------------------
  # Stage 2: Container Image Build & Security Scan (Trivy)
  # ---------------------------------------------------------------------------
  container-build:
    name: Docker Build & Vulnerability Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    strategy:
      matrix:
        service: [api-gateway, order-service, payment-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile.${{ matrix.service == 'api-gateway' && 'gateway' || (matrix.service == 'order-service' && 'order' || 'payment') }} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }} .

  # ---------------------------------------------------------------------------
  # Stage 3: Kubernetes Deployment Dry Run & Validation
  # ---------------------------------------------------------------------------
  k8s-validate:
    name: Kubernetes Manifest Lint & Dry-run
    needs: container-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Dry Run K8s Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/config-and-secrets.yaml
          kubectl apply --dry-run=client -f k8s/api-gateway-deployment.yaml
          kubectl apply --dry-run=client -f k8s/order-service-deployment.yaml
          kubectl apply --dry-run=client -f k8s/payment-service-deployment.yaml
          kubectl apply --dry-run=client -f k8s/ingress.yaml
