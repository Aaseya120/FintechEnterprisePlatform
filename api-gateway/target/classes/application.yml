server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # JWT Security Configuration (custom HMAC-SHA256 tokens, no external IdP)
  # Token validation handled by JwtGatewayAuthFilter

  cloud:
    gateway:
      routes:
        # Core Banking Account Service REST & GraphQL
        - id: account-service-rest
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: account-service-graphql
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/graphql
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@userOrIpKeyResolver}"

        # Core Banking Payment & Transfer Service
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userOrIpKeyResolver}"

        # Customer & Onboarding Service
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userOrIpKeyResolver}"

        # Loan Service
        - id: loan-service
          uri: ${LOAN_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/loans/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userOrIpKeyResolver}"

        # Card Management Service
        - id: card-service
          uri: ${CARD_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/cards/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userOrIpKeyResolver}"

        # Bill Payment Service
        - id: bill-payment-service
          uri: ${BILL_PAYMENT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/bills/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userOrIpKeyResolver}"

        # Fraud Detection Service
        - id: fraud-service
          uri: ${FRAUD_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/fraud/**

        # Notification Audit Service
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/notifications/**

        # Reporting & Statement Service
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/reports/**

        # Spring Batch & High-Volume Processing Service
        - id: batch-service
          uri: ${BATCH_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/batch/**

        # Legacy Core Banking System (CBS) SOAP Web Service
        - id: cbs-soap-service
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/ws/**

        # Forex / Exchange Rate Service
        - id: exchange-rate-service
          uri: ${EXCHANGE_RATE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/exchange-rates/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@userOrIpKeyResolver}"

      # Global CORS configuration for Web, iOS, and Android clients
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "https://banking.mycorp.com"
              - "capacitor://localhost"
              - "ionic://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "X-Correlation-ID"
              - "X-Channel"
              - "Idempotency-Key"
            allowCredentials: true
            maxAge: 3600

# Observability, Health & Actuator Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.banking: DEBUG
    org.springframework.cloud.gateway: INFO
