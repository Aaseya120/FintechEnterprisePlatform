server:
  port: 8090
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: batch-service

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false # Controlled execution via REST or Cron

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 10
      idle-timeout: 300000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

# Security Keys (MUST be overridden via environment variables in production)
banking:
  security:
    encryption:
      master-key: ${BANKING_ENCRYPTION_KEY:BankingEnterpriseSecretMasterKey2026!}
    jwt:
      secret: ${BANKING_JWT_SECRET:EnterpriseBankingSuperSecretKeyMustBeAtLeast256BitsLongForHmacSha256Security2026!}
      access-token-validity-seconds: 900
      refresh-token-validity-days: 7
