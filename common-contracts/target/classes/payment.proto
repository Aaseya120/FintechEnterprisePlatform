syntax = "proto3";

package com.enterprise.fintech.grpc;

option java_multiple_files = true;
option java_package = "com.enterprise.fintech.grpc";
option java_outer_classname = "PaymentProto";

service PaymentService {
    rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
    rpc RefundPayment (RefundRequest) returns (PaymentResponse);
    rpc GetPaymentStatus (PaymentStatusRequest) returns (PaymentResponse);
}

message PaymentRequest {
    string orderId = 1;
    string customerId = 2;
    double amount = 3;
    string currency = 4;
    string paymentMethod = 5;
    string idempotencyKey = 6;
}

message RefundRequest {
    string paymentId = 1;
    string orderId = 2;
    double refundAmount = 3;
    string reason = 4;
}

message PaymentStatusRequest {
    string paymentId = 1;
    string orderId = 2;
}

message PaymentResponse {
    string paymentId = 1;
    string orderId = 2;
    string status = 3; // SUCCESS, FAILED, PENDING, REFUNDED
    string transactionReference = 4;
    string message = 5;
    int64 timestamp = 6;
}
