version: '3.8'

services:
  # -------------------------------------------------------------
  # Message Broker: ActiveMQ Artemis
  # -------------------------------------------------------------
  activemq:
    image: apache/activemq-artemis:latest-alpine
    container_name: fintech-activemq
    environment:
      - ARTEMIS_USER=admin
      - ARTEMIS_PASSWORD=admin
    ports:
      - "61616:61616" # JMS Core port
      - "8161:8161"   # Artemis Web Console (admin/admin)
    networks:
      - fintech-network

  # -------------------------------------------------------------
  # Cache & Rate Limiting: Redis
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fintech-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - fintech-network

  # -------------------------------------------------------------
  # S3 Compatible Object Storage: MinIO
  # -------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: fintech-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Web Console (minioadmin/minioadmin)
    command: server /data --console-address ":9001"
    networks:
      - fintech-network

  # Bucket auto-creation helper for MinIO
  createbuckets:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'Waiting for MinIO...'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/fintech-invoices;
      /usr/bin/mc anonymous set download local/fintech-invoices;
      exit 0;
      "
    networks:
      - fintech-network

  # -------------------------------------------------------------
  # Relational Database: Oracle XE / Enterprise
  # -------------------------------------------------------------
  oracle-db:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: fintech-oracle
    environment:
      - ORACLE_PASSWORD=fintech_pass
      - APP_USER=fintech_user
      - APP_USER_PASSWORD=fintech_pass
    ports:
      - "1521:1521"
    networks:
      - fintech-network

  # -------------------------------------------------------------
  # Centralized Log Aggregation: Grafana Loki
  # -------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: fintech-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
    networks:
      - fintech-network

  # Promtail Log Shipper
  promtail:
    image: grafana/promtail:3.0.0
    container_name: fintech-promtail
    volumes:
      - ./promtail/config.yaml:/etc/promtail/config.yaml
      - /var/log:/var/log
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - fintech-network

  # -------------------------------------------------------------
  # Distributed Tracing: Zipkin
  # -------------------------------------------------------------
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: fintech-zipkin
    ports:
      - "9411:9411"
    networks:
      - fintech-network

  # -------------------------------------------------------------
  # Metrics & Visualization: Grafana
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: fintech-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - fintech-network

networks:
  fintech-network:
    driver: bridge
