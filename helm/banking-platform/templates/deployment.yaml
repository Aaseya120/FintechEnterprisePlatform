{{- range $key, $service := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  labels:
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/part-of: banking-platform
    environment: {{ $.Values.global.environment }}
spec:
  replicas: {{ $service.replicas }}
  # Zero-downtime rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $service.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $service.name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "{{ $service.port }}"
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: {{ $service.name }}
          image: "{{ $.Values.image.repository }}-{{ $service.imageSuffix }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $service.port }}
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: REDIS_HOST
              value: "banking-redis.production.cache.amazonaws.com"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "b-1.banking-kafka.amazonaws.com:9092,b-2.banking-kafka.amazonaws.com:9092"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service:8081"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8082"
            - name: EXCHANGE_RATE_SERVICE_URL
              value: "http://exchange-rate-service:8083"
          resources:
            requests:
              cpu: {{ $service.resources.requests.cpu }}
              memory: {{ $service.resources.requests.memory }}
            limits:
              cpu: {{ $service.resources.limits.cpu }}
              memory: {{ $service.resources.limits.memory }}
          # Kubernetes Readiness & Liveness Probes
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
{{- end }}
